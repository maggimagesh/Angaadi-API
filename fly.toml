# Fly.io deployment config for the webhook capture host.
# Bound to https://webhooks.angaadi.online via `fly certs add` + a CNAME
# record pointing at <app>.fly.dev.
#
# Rename `app` below to whatever you used with `fly launch`.

app = "angaadi-webhooks"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  WEBHOOK_PUBLIC_API_ORIGIN = "https://webhooks.angaadi.online"
  WEBHOOK_INSPECTOR_ORIGIN = "https://webhooks.angaadi.online"
  WEBHOOK_INSPECTOR_BASE_PATH = "/valid-webhooks"
  WEBHOOK_BODY_DIR = "/data/webhook_inbox"
  WEBHOOK_CALLBACK_SENDER_IP_HEADER = "x-callback-sender-ip,fly-client-ip"
  # 1 GiB per request body (matches the user-stated upper bound).
  WEBHOOK_MAX_BODY_BYTES = "1073741824"
  # Bodies above 256 KiB spill to disk so a 1 GiB upload never sits in memory.
  WEBHOOK_INLINE_BODY_BYTES = "262144"
  # Retain at most 500 callbacks per token. At 1 GiB each that bounds disk use
  # per token to ~5 GiB. Raise it only if you also raise the volume size.
  WEBHOOK_MAX_RECORDS_PER_TOKEN = "5000"
  # This is a debugging tool, not storage: captured requests (and their
  # disk-spilled bodies) are permanently deleted this many hours after
  # receipt by a periodic in-process sweep. Shown to users in the inspector UI.
  WEBHOOK_RETENTION_HOURS = "48"
  # Node's libuv threadpool (fs ops, dns.reverse) defaults to 4 threads.
  # Under concurrent webhook bursts that starves file reads/writes and stalls
  # response writes. Raise it well above expected concurrent connections.
  UV_THREADPOOL_SIZE = "128"

# Persistent volume for disk-spilled webhook bodies. Survives machine restarts
# and is what stops a 1 GiB upload from blowing through /tmp.
[mounts]
  source = "webhook_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  # Keep at least one machine warm so multi-minute uploads don't hit a
  # cold start mid-stream.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  # Without this block Fly's proxy applies its own default per-machine
  # connection limits, which is what was silently throttling/queuing load-test
  # traffic before it ever reached Node. Sized with headroom above the
  # 500-parallel-callback target.
  [http_service.concurrency]
    type = "connections"
    soft_limit = 800
    hard_limit = 1000

[[vm]]
  cpu_kind = "shared"
  # Left at 1 cpu / 1024 MB: webhook capture is I/O-bound (small JSON in,
  # small JSON out; TLS is terminated at Fly's edge, not here), and the
  # UV_THREADPOOL_SIZE bump above already removes the actual bottleneck.
  # Only raise this (`fly scale vm shared-cpu-2x`) if a real load test shows
  # CPU or memory actually saturating in `fly status` / `fly logs` — that's
  # the only reason to pay for more here.
  cpus = 1
  memory_mb = 1024
